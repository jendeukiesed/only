# Production-shaped stack: the app container (built from ../Dockerfile),
# Postgres, and Redis. Intended for a single-VM/VPS deployment or as a
# reference for translating into a Kubernetes/ECS manifest — the Vercel
# deployment path (see .github/workflows/deploy.yml) doesn't use this file
# at all, since Vercel builds the Next.js app natively and only needs a
# managed Postgres/Redis connection string.
#
# Usage: `docker compose -f docker/docker-compose.yml --env-file ../.env up -d --build`
services:
  app:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://pawdrop:${POSTGRES_PASSWORD:-pawdrop}@postgres:5432/pawdrop?schema=public
      DIRECT_URL: postgresql://pawdrop:${POSTGRES_PASSWORD:-pawdrop}@postgres:5432/pawdrop?schema=public
      REDIS_URL: redis://redis:6379
      NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL:-http://localhost:3000}
      NEXTAUTH_URL: ${NEXTAUTH_URL:-http://localhost:3000}
      AUTH_SECRET: ${AUTH_SECRET:?AUTH_SECRET must be set}
      AUTH_GOOGLE_ID: ${AUTH_GOOGLE_ID:-}
      AUTH_GOOGLE_SECRET: ${AUTH_GOOGLE_SECRET:-}
      TOTP_ISSUER: ${TOTP_ISSUER:-PawDrop}
      CLOUDINARY_CLOUD_NAME: ${CLOUDINARY_CLOUD_NAME:-}
      CLOUDINARY_API_KEY: ${CLOUDINARY_API_KEY:-}
      CLOUDINARY_API_SECRET: ${CLOUDINARY_API_SECRET:-}
      NEXT_PUBLIC_CLOUDINARY_CLOUD_NAME: ${NEXT_PUBLIC_CLOUDINARY_CLOUD_NAME:-}
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      EMAIL_FROM: ${EMAIL_FROM:-PawDrop <hello@pawdrop.app>}
      AI_SCORING_PROVIDER: ${AI_SCORING_PROVIDER:-mock}
      AI_SCORING_API_KEY: ${AI_SCORING_API_KEY:-}
      AI_SCORING_MODEL: ${AI_SCORING_MODEL:-gpt-4o-mini}
      UPSTASH_REDIS_REST_URL: ${UPSTASH_REDIS_REST_URL:-}
      UPSTASH_REDIS_REST_TOKEN: ${UPSTASH_REDIS_REST_TOKEN:-}
      PLATFORM_COMMISSION_PERCENT: ${PLATFORM_COMMISSION_PERCENT:-20}
      STARTING_BUYER_POINTS: ${STARTING_BUYER_POINTS:-100}
      STARTING_SELLER_POINTS: ${STARTING_SELLER_POINTS:-0}
      CRON_SECRET: ${CRON_SECRET:?CRON_SECRET must be set}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3000/api/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 30s
      timeout: 5s
      start_period: 15s
      retries: 3

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: pawdrop
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-pawdrop}
      POSTGRES_DB: pawdrop
    volumes:
      - pawdrop_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pawdrop"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    volumes:
      - pawdrop_redis_data:/data

volumes:
  pawdrop_postgres_data:
  pawdrop_redis_data:
